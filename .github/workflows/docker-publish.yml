name: Publish Docker image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # A pre-release tag (anything with a "-", e.g. v0.4.0-rc1) publishes only
          # its own tag; :latest moves only for full releases. build-push-action
          # skips the empty line the expression leaves for a pre-release.
          tags: |
            ghcr.io/suadelabs/suade-fire-mcp:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && 'ghcr.io/suadelabs/suade-fire-mcp:latest' || '' }}
