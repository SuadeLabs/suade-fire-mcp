[project]
name = "suade-fire-mcp"
version = "0.6.1"
description = "MCP server exposing the FIRE data standard for schema mapping"
readme = "README.md"
license = "Apache-2.0"
# FIRE's own LICENSE ships inside the package, next to the bundled data.
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp==2.3.0",
    "jsonschema>=4.20,<5",
    # jsonschema only checks "format": "date-time" when this is importable.
    "rfc3339-validator>=0.1.4",
    "referencing>=0.28",
    "rapidfuzz>=3.6",
    # Imported directly by server.py; mcp's own floor on Python < 3.14.
    "starlette>=0.27",
    # TypedDict/NotRequired in tool result types; Pydantic needs this TypedDict
    # (not typing's) to build output schemas on Python < 3.12.
    "typing_extensions>=4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mcp[cli]==2.3.0",
    # Pinned so local runs and CI lint identically.
    "ruff==0.17.5",
    "black==26.10.1",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/SuadeLabs/suade-fire-mcp"
Issues = "https://github.com/SuadeLabs/suade-fire-mcp/issues"
"FIRE data standard" = "https://github.com/SuadeLabs/fire"

[project.scripts]
fire-mcp = "fire_mcp.server:main"
# Same entry point under the package name, so `uvx suade-fire-mcp` works.
suade-fire-mcp = "fire_mcp.server:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fire_mcp*"]

# The FIRE data vendored by scripts/vendor_fire.py before a release build. Absent
# in a plain source checkout, so a git install still needs FIRE_REPO_ROOT.
[tool.setuptools.package-data]
fire_mcp = ["_fire/**/*"]

[tool.ruff]
line-length = 88
exclude = ['*venv*']

[tool.ruff.lint]
select = ['E', 'W', 'F', 'B']
ignore = ['E501']

[tool.pytest.ini_options]
testpaths = ["tests"]
