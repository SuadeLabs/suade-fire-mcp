name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # A tag can land on any commit, so run the full CI workflow (lint, tests on
  # every supported Python against the pinned FIRE release, and the package
  # smoke test) before anything is published.
  test:
    uses: ./.github/workflows/ci.yml

  docker:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          # A pre-release tag (anything with a "-", e.g. v0.4.0-rc1) publishes only
          # its own tag; :latest moves only for full releases. build-push-action
          # skips the empty line the expression leaves for a pre-release.
          tags: |
            ghcr.io/suadelabs/suade-fire-mcp:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && 'ghcr.io/suadelabs/suade-fire-mcp:latest' || '' }}

  build-package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: suade-fire-mcp

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      # PyPI versions can never be reused, so refuse to build one whose
      # version disagrees with the tag (v0.6.0 vs 0.6.0; v0.6.0-rc1 vs 0.6.0rc1).
      - name: Check the tag matches the package version
        working-directory: suade-fire-mcp
        run: |
          pip install packaging
          python - <<'PY'
          import os, tomllib
          from packaging.version import Version
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          if Version(tag) != Version(version):
              raise SystemExit(f"Tag {tag} does not match pyproject version {version}.")
          PY

      - name: Read pinned FIRE version
        id: fire
        working-directory: suade-fire-mcp
        run: echo "version=$(sed -n 's/^ARG FIRE_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SuadeLabs/fire
          ref: ${{ steps.fire.outputs.version }}
          path: fire

      - name: Vendor FIRE and build
        working-directory: suade-fire-mcp
        run: |
          python scripts/vendor_fire.py ../fire --version "${{ steps.fire.outputs.version }}"
          pip install "build>=1.2"
          python -m build --outdir ../dist

      - name: Smoke-test the wheel
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/pip install dist/*.whl
          wheel-venv/bin/python -I suade-fire-mcp/scripts/check_wheel.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Trusted publishing: PyPI trusts this workflow + environment via OIDC, so no
  # API token is stored. Configure it once on PyPI (Publishing -> add a trusted
  # publisher: owner SuadeLabs, repo suade-fire-mcp, workflow release.yml,
  # environment pypi).
  pypi:
    needs: build-package
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/suade-fire-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Lists the release in the MCP Registry (registry.modelcontextprotocol.io).
  # GitHub OIDC proves this repo belongs to the SuadeLabs org, which owns the
  # io.github.suadelabs/ namespace. Full releases only.
  mcp-registry:
    needs: pypi
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      # The registry checks the package on PyPI, which can take a minute to
      # show a just-uploaded release; retry rather than fail the release.
      - name: Publish to the MCP Registry
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "Attempt $attempt failed; retrying in 30s."
            sleep 30
          done
          exit 1
