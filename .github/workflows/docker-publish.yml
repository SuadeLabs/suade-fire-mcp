name: Publish Docker image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  # A tag can land on any commit, so run the full CI workflow (lint, tests on
  # every supported Python against the pinned FIRE release) before anything
  # is pushed to the registry.
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          # A pre-release tag (anything with a "-", e.g. v0.4.0-rc1) publishes only
          # its own tag; :latest moves only for full releases. build-push-action
          # skips the empty line the expression leaves for a pre-release.
          tags: |
            ghcr.io/suadelabs/suade-fire-mcp:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && 'ghcr.io/suadelabs/suade-fire-mcp:latest' || '' }}
