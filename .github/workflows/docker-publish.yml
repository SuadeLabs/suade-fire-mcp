name: Publish Docker image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/suadelabs/suade-fire-mcp:${{ github.ref_name }}
            ghcr.io/suadelabs/suade-fire-mcp:latest

  # Roll the hosted instance (fly.toml) onto the image just pushed, so a release tag is
  # one image and one deploy. Needs a FLY_API_TOKEN repo secret (`fly tokens create deploy`).
  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: flyctl deploy --image ghcr.io/suadelabs/suade-fire-mcp:${{ github.ref_name }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
