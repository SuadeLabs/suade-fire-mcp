# Fly.io app config for the one convenience public instance of fire-mcp.
# This is NOT required to use this project -- anyone can run the published image
# (ghcr.io/suadelabs/suade-fire-mcp) anywhere. This file only configures the one hosted
# copy under the SuadeLabs org.
#
# FIRE_MCP_ALLOWED_HOSTS / FIRE_MCP_ALLOWED_ORIGINS are set via `fly secrets set`, not here,
# since they depend on whatever hostname this app ends up with.

app = "suade-fire-mcp"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one machine warm: a cold start on the first request can push Claude's
  # `initialize` call past its timeout, which shows up as "Couldn't reach the MCP server".
  min_machines_running = 1

  # All claude.ai traffic arrives from Anthropic's egress range (160.79.104.0/21), so a
  # per-IP rate limit would throttle every Claude user at once. Cap concurrency per
  # machine instead and let Fly start another machine under load.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
