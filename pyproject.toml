[project]
name = "suade-fire-mcp"
version = "0.4.0"
description = "MCP server exposing the FIRE data standard for schema mapping"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.2.0",
    "jsonschema>=4.20,<5",
    # jsonschema only checks "format": "date-time" when this is importable.
    "rfc3339-validator>=0.1.4",
    "referencing>=0.28",
    "rapidfuzz>=3.6",
    # Imported directly by server.py; mcp's own floor on Python < 3.14.
    "starlette>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mcp[cli]==2.2.0",
    # Pinned so local runs and CI lint identically.
    "ruff==0.17.4",
    "black==24.2.0",
]

[project.scripts]
fire-mcp = "fire_mcp.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fire_mcp*"]

[tool.ruff]
line-length = 88
exclude = ['*venv*']

[tool.ruff.lint]
select = ['E', 'W', 'F', 'B']
ignore = ['E501']

[tool.pytest.ini_options]
testpaths = ["tests"]
